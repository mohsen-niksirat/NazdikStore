services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      REDIS_URL: ""
      PAYMENT_PROVIDER: mock
      ALLOW_OFFLINE: "1"
      CORS_ORIGINS: "http://127.0.0.1:3000,http://localhost:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3300:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
    depends_on:
      - api
