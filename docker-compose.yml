services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nazdik-postgres
    environment:
      POSTGRES_USER: nazdik
      POSTGRES_PASSWORD: nazdik_local
      POSTGRES_DB: nazdik
    ports:
      - "5432:5432"
    volumes:
      - nazdik_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazdik -d nazdik"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nazdik-redis
    ports:
      - "6379:6379"
    volumes:
      - nazdik_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nazdik-mailhog
    ports:
      - "8025:8025"
    profiles:
      - tools

volumes:
  nazdik_pg:
  nazdik_redis:
