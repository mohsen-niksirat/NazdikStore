name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Isolated install — do NOT npm install inside the monorepo (workspaces break CI)
      - name: Install isolated test deps
        run: |
          mkdir -p "$RUNNER_TEMP/nazdik-ci"
          cd "$RUNNER_TEMP/nazdik-ci"
          npm init -y
          npm install typescript @nestjs/jwt @nestjs/common @nestjs/core @nestjs/testing @nestjs/passport passport passport-jwt class-validator class-transformer ioredis reflect-metadata rxjs helmet --no-package-lock --registry https://registry.npmjs.org
          echo "CI_NODE_MODULES=$RUNNER_TEMP/nazdik-ci/node_modules" >> "$GITHUB_ENV"

      - name: Bootstrap stubs + NODE_PATH
        working-directory: apps/api
        env:
          NODE_PATH: ${{ env.CI_NODE_MODULES }}
        run: node test/ci-bootstrap.cjs

      - name: Phase 1-5 unit + prod guards
        working-directory: apps/api
        env:
          NODE_PATH: ${{ env.CI_NODE_MODULES }}
        run: |
          node test/run-phase1.cjs
          node test/run-phase2.cjs
          node test/run-phase3.cjs
          node test/run-phase4.cjs
          node test/run-phase5.cjs
          node test/run-prod-guards.cjs

      - name: Mini API smoke (phase 6-10)
        working-directory: apps/api
        env:
          NODE_PATH: ${{ env.CI_NODE_MODULES }}
          REDIS_URL: ""
          ALLOW_OFFLINE: "1"
        run: |
          node test/mini-server.cjs > /tmp/api.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4000/api/v1/health; then
              echo "API up"
              break
            fi
            sleep 1
          done
          node test/run-phase6.cjs
          node test/run-phase9.cjs
          cat /tmp/api.log || true

      - name: Secret / gitignore hygiene
        run: |
          test ! -f .env
          grep -q '\.env' .gitignore
          test -f .env.production.example
          echo OK
