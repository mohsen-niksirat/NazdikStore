name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pure JS smoke — no npm install required
      - name: Pure smoke (no deps)
        run: node apps/api/test/ci-pure.cjs

      - name: Install test deps into apps/api/node_modules
        working-directory: apps/api
        run: |
          set -eux
          mkdir -p node_modules
          npm install \
            typescript \
            @nestjs/jwt \
            @nestjs/common \
            @nestjs/core \
            @nestjs/testing \
            @nestjs/passport \
            passport \
            passport-jwt \
            class-validator \
            class-transformer \
            ioredis \
            reflect-metadata \
            rxjs \
            helmet \
            --no-package-lock \
            --no-save \
            --registry https://registry.npmjs.org \
            --fetch-retries=5 \
            --fetch-retry-mintimeout=20000 \
            --fetch-retry-maxtimeout=120000
          echo "=== node_modules sample ==="
          ls node_modules | head
          node -e "console.log('typescript', require('typescript').version)"
          node test/ci-bootstrap.cjs

      - name: Phase 1-5 unit + prod guards
        working-directory: apps/api
        run: |
          set -eux
          node test/run-phase1.cjs
          node test/run-phase2.cjs
          node test/run-phase3.cjs
          node test/run-phase4.cjs
          node test/run-phase5.cjs
          node test/run-prod-guards.cjs

      - name: Mini API smoke (phase 6-10)
        working-directory: apps/api
        env:
          REDIS_URL: ""
          ALLOW_OFFLINE: "1"
        run: |
          set -eux
          node test/mini-server.cjs > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/api/v1/health; then
              echo
              echo API_UP
              break
            fi
            sleep 1
          done
          cat /tmp/api.log || true
          node test/run-phase6.cjs
          node test/run-phase9.cjs

      - name: Secret / gitignore hygiene
        run: |
          test ! -f .env
          grep -q '\.env' .gitignore
          test -f .env.production.example
          echo OK
