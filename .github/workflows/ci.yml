name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pure smoke (no deps)
        run: node apps/api/test/ci-pure.cjs

      # Install at REPO ROOT — npm workspaces hoist packages here
      - name: Install test deps (repo root, workspaces disabled)
        run: |
          set -eux
          npm install \
            typescript \
            @nestjs/jwt \
            @nestjs/common \
            @nestjs/core \
            @nestjs/testing \
            @nestjs/passport \
            passport \
            passport-jwt \
            class-validator \
            class-transformer \
            ioredis \
            reflect-metadata \
            rxjs \
            helmet \
            libphonenumber-js \
            validator \
            --no-package-lock \
            --no-save \
            --workspaces=false \
            --registry https://registry.npmjs.org \
            --fetch-retries=5

      - name: Mirror deps into apps/api/node_modules
        run: |
          set -eux
          mkdir -p apps/api/node_modules
          # link/copy hoisted packages so absolute path requires also work
          for p in typescript @nestjs @prisma class-validator class-transformer ioredis reflect-metadata rxjs helmet libphonenumber-js validator passport passport-jwt; do
            if [ -e "node_modules/$p" ] && [ ! -e "apps/api/node_modules/$p" ]; then
              cp -a "node_modules/$p" "apps/api/node_modules/$p" 2>/dev/null || true
            fi
          done
          node -e "console.log('ts', require('typescript').version); console.log('jwt', require.resolve('@nestjs/jwt'))"
          cd apps/api && node test/ci-bootstrap.cjs

      - name: Phase 1-5 unit + prod guards
        working-directory: apps/api
        run: |
          set -eux
          node test/run-phase1.cjs
          node test/run-phase2.cjs
          node test/run-phase3.cjs
          node test/run-phase4.cjs
          node test/run-phase5.cjs
          node test/run-prod-guards.cjs

      - name: Mini API smoke (phase 6-10)
        working-directory: apps/api
        env:
          REDIS_URL: ""
          ALLOW_OFFLINE: "1"
          PORT: "4000"
        run: |
          set -eux
          node -e "console.log('jwt resolve', require.resolve('@nestjs/jwt'))"
          node test/mini-server.cjs > /tmp/api.log 2>&1 &
          API_PID=$!
          UP=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4000/api/v1/health; then
              echo
              echo API_UP
              UP=1
              break
            fi
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "API process died"
              break
            fi
            sleep 1
          done
          echo "===== /tmp/api.log ====="
          cat /tmp/api.log || true
          if [ "$UP" != "1" ]; then
            echo "Mini API failed to start" >&2
            exit 1
          fi
          node test/run-phase6.cjs
          node test/run-phase9.cjs

      - name: Secret / gitignore hygiene
        run: |
          test ! -f .env
          grep -q '\.env' .gitignore
          test -f .env.production.example
          echo OK
