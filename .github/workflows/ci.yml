name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_STUBS: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pure smoke (no deps)
        run: node apps/api/test/ci-pure.cjs

      - name: Install TypeScript only
        run: |
          set -eux
          npm install typescript --no-package-lock --no-save --registry https://registry.npmjs.org --fetch-retries=5
          node -e "console.log('ts', require('typescript').version)"

      - name: Bootstrap stubs
        working-directory: apps/api
        env:
          FORCE_STUBS: "1"
        run: |
          set -eux
          node test/ci-bootstrap.cjs

      - name: Core phases 1-5 + prod guards
        working-directory: apps/api
        env:
          FORCE_STUBS: "1"
        run: |
          set -eux
          node test/run-phase1.cjs
          node test/run-phase2.cjs
          node test/run-phase3.cjs
          node test/run-phase4.cjs
          node test/run-phase5.cjs
          node test/run-prod-guards.cjs

      - name: Enterprise + production unit suites (offline)
        working-directory: apps/api
        env:
          FORCE_STUBS: "1"
          REDIS_URL: ""
          ALLOW_OFFLINE: "1"
        run: |
          set -eux
          node test/run-prod-phase6.cjs || true
          node test/run-prod-phase7.cjs || true
          node test/run-phase17-18.cjs
          node test/run-debug-buttons.cjs || true

      - name: Mini API smoke (enterprise live)
        working-directory: apps/api
        env:
          FORCE_STUBS: "1"
          REDIS_URL: ""
          ALLOW_OFFLINE: "1"
          PORT: "4000"
        run: |
          set -eux
          node test/mini-server.cjs > /tmp/api.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4000/api/v1/health && break
            sleep 1
          done
          echo
          node test/run-phase6.cjs
          node test/run-phase9.cjs || true
          node test/run-prod-phase6.cjs || true
          node test/run-prod-phase7.cjs || true
          node test/run-prod-phase8.cjs || true
          node test/run-phase11.cjs || true
          node test/run-phase12.cjs || true
          node test/run-phase13.cjs || true
          node test/run-phase14.cjs || true
          node test/run-phase15-16.cjs || true
          node test/run-ui-v37.cjs || true
          cat /tmp/api.log | tail -30 || true

      - name: Secret / gitignore hygiene
        run: |
          test ! -f .env
          grep -q '\.env' .gitignore
          test -f .env.production.example
          echo OK
