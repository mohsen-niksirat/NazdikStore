name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_STUBS: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pure smoke (no deps)
        run: node apps/api/test/ci-pure.cjs

      # Only TypeScript is required for on-the-fly transpile.
      # Nest/rxjs/prisma are STUBBED (FORCE_STUBS=1) — real @nestjs/common
      # + hoisted rxjs breaks Node 22 ESM with ERR_UNSUPPORTED_DIR_IMPORT.
      - name: Install TypeScript only
        run: |
          set -eux
          npm install typescript --no-package-lock --no-save --registry https://registry.npmjs.org --fetch-retries=5
          node -e "console.log('ts', require('typescript').version)"

      - name: Bootstrap stubs into apps/api/node_modules
        working-directory: apps/api
        env:
          FORCE_STUBS: "1"
        run: |
          set -eux
          node test/ci-bootstrap.cjs
          # ensure jwt stub resolves from apps/api
          node -e "console.log('jwt', require.resolve('@nestjs/jwt'))"

      - name: Phase 1-5 unit + prod guards
        working-directory: apps/api
        env:
          FORCE_STUBS: "1"
        run: |
          set -eux
          node test/run-phase1.cjs
          node test/run-phase2.cjs
          node test/run-phase3.cjs
          node test/run-phase4.cjs
          node test/run-phase5.cjs
          node test/run-prod-guards.cjs

      - name: Mini API smoke (phase 6-10)
        working-directory: apps/api
        env:
          FORCE_STUBS: "1"
          REDIS_URL: ""
          ALLOW_OFFLINE: "1"
          PORT: "4000"
        run: |
          set -eux
          node test/mini-server.cjs > /tmp/api.log 2>&1 &
          API_PID=$!
          UP=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4000/api/v1/health; then
              echo
              echo API_UP
              UP=1
              break
            fi
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "API process died"
              break
            fi
            sleep 1
          done
          echo "===== /tmp/api.log ====="
          cat /tmp/api.log || true
          if [ "$UP" != "1" ]; then
            echo "Mini API failed to start" >&2
            exit 1
          fi
          node test/run-phase6.cjs
          node test/run-phase9.cjs

      - name: Secret / gitignore hygiene
        run: |
          test ! -f .env
          grep -q '\.env' .gitignore
          test -f .env.production.example
          echo OK
